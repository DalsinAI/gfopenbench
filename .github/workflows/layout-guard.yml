# Layout guard (Dale, 13 Nov 06:50: wave-1 drawing goes through GFOpenLayout).
# Fails a PR that adds graphics.library drawing calls (RectFill, BltBitMap,
# BltTemplate, Text, Move, Draw, SetAPen, SetBPen, SetDrMd, ScrollRaster,
# EraseRect and the blit variants) outside GFOpenLayout's own sources. Calls
# already in the tree only warn; all are listed in the job's log and summary.
# Exception: "LAYOUT-EXCEPTION: <reason>" in the PR description, and a PR comment
# "LAYOUT-EXCEPTION: APPROVE <sha8>" with "Reviewer: <name> (Team 3)" for the
# current head. Team 3 writes it in amicradle-teams and Team 5 copies it onto the
# PR with the note's path; the next push or a CI re-run picks it up. Paths
# GFOpenLayout owns, or listed in .layout-guard-allow (one glob per line), are
# not checked.
# CI is bigguy's, on the forge (no GitHub, 25 Nov 2026): the PR's comments are read
# from the forge's API with the jobs' read-only FORGE_TOKEN.
name: Layout guard
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: layout-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  layout:
    runs-on: [self-hosted, lumavault]
    timeout-minutes: 10
    steps:
      # no ref: on bigguy (act) the workspace already is the pull request's head, and a checkout naming a ref
      # wiped it and fetched the head again (every job then failed)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: guard
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/body.txt"
          # the forge's address is the checkout's origin (http://host:3000/Owner/repo.git)
          forge=$(git remote get-url origin | sed -E 's#^(https?://)[^@/]*@#\1#; s#^(https?://[^/]+)/.*#\1#')
          : > "$RUNNER_TEMP/comments.txt"
          if [ -n "${FORGE_TOKEN:-}" ] && [ -n "$forge" ]; then
            page=1
            while :; do
              got=$(curl -fsS -H "Authorization: token $FORGE_TOKEN" \
                    "$forge/api/v1/repos/$GITHUB_REPOSITORY/issues/$PR/comments?limit=50&page=$page") || { echo "::warning::the PR's comments could not be read from the forge"; break; }
              n=$(printf '%s' "$got" | jq 'length')
              [ "$n" -gt 0 ] || break
              printf '%s' "$got" | jq -r '.[] | select(.body | contains("<!-- layout-guard -->") | not) | .body + "\n\u001e"' >> "$RUNNER_TEMP/comments.txt"
              [ "$n" -lt 50 ] && break
              page=$((page + 1))
            done
          else
            echo "::warning::no FORGE_TOKEN: the PR's comments (exception approvals) are not read"
          fi
          python3 -I .github/layout-guard/layout_guard.py --self-test || exit 1
          # the split the script reads: each comment, then a line holding only 0x1E (jq's \u001e escape)
          [ "$(printf '[{"body":"a"}]' | jq -r '.[] | .body + "\n\u001e"' | od -An -tx1 | tr -d ' \n')" = 610a1e0a ] || { echo "jq comment split broken"; exit 1; }
          python3 -I .github/layout-guard/layout_guard.py "$BASE" "$HEAD" \
            --body "$RUNNER_TEMP/body.txt" --comments "$RUNNER_TEMP/comments.txt" \
            --report "$RUNNER_TEMP/report.md"
          rc=$?
          if [ -s "$RUNNER_TEMP/report.md" ]; then
            cat "$RUNNER_TEMP/report.md"
            cat "$RUNNER_TEMP/report.md" >> "${GITHUB_STEP_SUMMARY:-/dev/null}" || true
          fi
          exit $rc
