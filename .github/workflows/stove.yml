# Builds GFOpenBench with the os32-gcc16 stove (m68k-amigaos-gcc 16 and NDK 3.2; the NDK is never in this
# repository) and runs the host tests, both on bigguy's runners (lumavault): GitHub's are not used, and
# amigachromebuild's runners are gone. The stove is .github/actions/stove (gfopenup's): GFOpenAmigaGCC from
# gfopengcc's release and NDK3.2.lha from Aminet, checked against their sha256s. The compiler's messages show on
# the pull request as annotations.
#
# This repository is public, so the build runs only for pushes and for pull requests from branches of this
# repository, never for a fork's: a fork's code never runs on the Team's machines.
# MIT, Copyright (c) 2026 AmiCradle Team.
name: Build on the stove
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  os3:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, lumavault]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/stove
      - name: Build
        shell: bash
        run: |
          export STOVE="${OS32_GCC16:-$(sh tools/stove-dir.sh)}"
          if [ ! -x "$STOVE/prefix/bin/m68k-amigaos-gcc" ]; then
            echo "::error::No os32-gcc16 stove at $STOVE (.github/actions/stove)"
            exit 1
          fi
          mkdir -p build/os3
          status=0
          sh build.sh build/os3 > build/step.log 2>&1 || status=1
          cat build/step.log
          # each compiler message as an annotation on its line (none is fine)
          { grep -E '^[^ :]+:[0-9]+:[0-9]+: (fatal error|error|warning|note):' build/step.log || true; } | while IFS= read -r l; do
            f=${l%%:*}; rest=${l#*:}; line=${rest%%:*}; rest=${rest#*:}; col=${rest%%:*}; rest=${rest#*: }
            kind=${rest%%:*}; msg=${rest#*: }
            f=${f#"$GITHUB_WORKSPACE/"}
            case "$kind" in *error) level=error ;; warning) level=warning ;; *) level=notice ;; esac
            echo "::$level file=$f,line=$line,col=$col::$msg"
          done
          if [ "$status" = 1 ]; then
            tail -n 40 build/step.log | sed "s#$GITHUB_WORKSPACE/##g" | awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); print}' > build/tail.txt
            echo "::error title=build.sh failed::$(cat build/tail.txt)"
          else
            echo "::notice title=build.sh built::$(tail -n 1 build/step.log | sed "s#$GITHUB_WORKSPACE/##g")"
          fi
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true      # GitHub's storage is billed; the build's log is the record
        with:
          name: os3
          path: build/os3
          if-no-files-found: ignore
  host:
    runs-on: [self-hosted, lumavault]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: A C compiler and Python's PIL (bigguy's fresh containers)
        run: |
          command -v cc >/dev/null && python3 -c 'import PIL' 2>/dev/null || { S=$([ "$(id -u)" = 0 ] || echo sudo)
            $S apt-get update -q && $S apt-get install -y -q --no-install-recommends build-essential python3 python3-pil; }
      - name: Host tests
        run: sh tests/host/run.sh
